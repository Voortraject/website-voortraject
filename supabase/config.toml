# CRM-project (Voortraject CRM). De backend van de website leeft hier, niet meer
# in het verlaten Lovable-project. Deploy dus tegen dit project-ref
# (supabase functions deploy … --project-ref lfelnfukbrxznkevnevr).
#
# LET OP: dit is dezelfde database als die van de CRM-app. Alleen edge functions
# worden vanuit deze repo uitgerold. SCHEMAWIJZIGINGEN GAAN ALLEEN VANUIT HET CRM
# (afspraak 2026-08-10) — draai hiervandaan dus geen `supabase db push`. Zie
# supabase/migrations/README.md.
project_id = "lfelnfukbrxznkevnevr"

# Google-reviews sync. Geen JWT nodig: de functie draait via cron en gebruikt
# intern de service_role. Zet de secrets GOOGLE_MAPS_API_KEY en GOOGLE_PLACE_ID
# in de Supabase-dashboard (Edge Functions → Secrets), niet in dit bestand.
[functions.sync-google-reviews]
verify_jwt = false

# Subsidiecheck-databrug: haalt serverside de Energiesubsidiewijzer van Milieu
# Centraal op, vertaalt naar onze types + cachet, en levert JSON met open CORS.
# Geen JWT: publiek/anoniem te gebruiken. Raakt de database niet.
# Secret: ESW_API_KEY (de API-key van Milieu Centraal). Is die niet gezet, dan
# valt de function terug op de oude route (scrape van hun publieke site), zodat
# de secret weghalen een directe rollback is zonder deploy.
[functions.subsidiecheck]
verify_jwt = false

# "Mail mij dit overzicht": schrijft de lead (service_role) en stuurt de mail via
# Resend. Behandelt ook de vraag die de bezoeker op het resultaat stelt (actie
# "bericht"). Geen JWT: wordt anoniem vanaf de site aangeroepen. Secrets:
# RESEND_API_KEY, MAIL_FROM, MAIL_BCC (optioneel), MAIL_TEAM (optioneel, ontvanger
# van de vraag-mails), MAIL_REPLY_TO (optioneel).
[functions.subsidiecheck-mail]
verify_jwt = false

# Woninginfo-brug: haalt server-side het geregistreerde energielabel op via de
# EP-Online API (RVO) en levert genormaliseerde JSON met open CORS. Geen JWT:
# publiek/anoniem te gebruiken. Secret: EP_ONLINE_API_KEY.
[functions.woninginfo]
verify_jwt = false